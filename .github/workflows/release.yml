name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then TAG="$GITHUB_REF_NAME"; fi
          ./scripts/package-release.sh --validate-only "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Test
        env:
          PINBOARD_TEST_ARTIFACTS: ${{ runner.temp }}/pinboard-ui
        run: swift test
      - name: Retain menu bar render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: menu-bar-ui-${{ matrix.arch }}
          path: ${{ runner.temp }}/pinboard-ui/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Package release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/package-release.sh "$RELEASE_TAG"
          ./Tests/ReleasePackagingTests.sh "$RELEASE_TAG" "$RELEASE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinboard-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pinboard-*
          path: dist
          merge-multiple: true
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARM="Pinboard-$VERSION-macos-arm64.dmg"
          INTEL="Pinboard-$VERSION-macos-x86_64.dmg"
          cd dist
          cat "$ARM.sha256" "$INTEL.sha256" > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          cat > release-notes.md <<EOF
          Native macOS clipboard pins with rich text, GitHub Flavored Markdown, image annotations, and local history.

          Download the arm64 DMG for Apple Silicon or the x86_64 DMG for Intel. Open the disk image, drag Pinboard.app onto the Applications shortcut, then eject the image. The minimum macOS version is recorded in the app's Info.plist.

          The app inside each DMG is ad-hoc signed and is not notarized. macOS may require approval in System Settings → Privacy & Security before the first launch. See the repository README for installation details.

          Verify a download with the corresponding entry in SHA256SUMS. Both disk images were built and tested from commit $GITHUB_SHA.
          EOF
          if DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$DRAFT" != true ]]; then
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$ARM" "$INTEL" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "$ARM" "$INTEL" SHA256SUMS \
              --verify-tag --draft --title "Pinboard $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
